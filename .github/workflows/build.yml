name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Print Failure Info
        if: failure()
        run: |
          echo "=== Gradle Logs / Reports ==="
          find build -type f -name "*.txt" -o -name "*.log" | xargs head -n 50 || true

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkProPlus-5.26.9-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.26.9' }}
          name: "TeamTalk Pro Plus v5.26.9"
          body: |
            ### TeamTalk Pro Plus v5.26.9

            #### Список изменений:
            - **🔙 Полностью восстановлена оригинальная логика кнопок «Назад» и «Вверх» из v5.25:**
              - Кнопки «Назад» и стрелка «Вверх» (Home/Up в тулбаре) теперь работают строго как в оригинальной проверенной версии 5.25:
                - Переключают на вкладку «Каналы» с вкладок «Чат» и «Файлы».
                - Поднимаются на уровень выше по иерархии комнат/папок (`parentChannel`).
                - При достижении корня аккуратно и чисто отключаются от сервера и выходят в список серверов.
            - **🚪 Сохранение комнаты при «Покинуть канал»:**
              - Выход из канала не сбрасывает фокус с выбранной комнаты.
            - **📦 Полный комплект нативных библиотек под все 4 ABI:**
              - `armeabi-v7a` (32-бит ARM), `arm64-v8a` (64-бит ARM), `x86` (32-бит), `x86_64` (64-бит).
            - **🌐 Публикация сервера прямо из меню сервера.**
          draft: false
          prerelease: false
          files: |
            build/outputs/apk/debug/*.apk
            TeamTalkProPlus-5.26.9-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
