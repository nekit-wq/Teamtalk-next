name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_err.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload Failure Log to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure-log
          name: "Build Failure Log"
          files: gradle_err.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkNext-5.27.20-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.27.20' }}
          name: "TeamTalk Next v5.27.20"
          body: |
            ### TeamTalk Next v5.27.20 — Вкладки профилей в стиле браузера (Multi-Tabs)

            #### 🚀 Главные улучшения:
            - **🌐 Полноценные вкладки профилей сверху (как вкладки в браузере):**
              - В верхней части экрана списка серверов и окна сервера добавлена удобная горизонтальная полоса вкладок.
              - Каждая открытая вкладка — это отдельный независимый профиль со своим сервером, никнеймом, списком каналов и настройками.
              - Кнопка **«➕ Новая вкладка / Профиль»** позволяет мгновенно:
                - Создать новый чистый профиль
                - Клонировать текущий профиль со всеми серверами и настройками
                - Открыть любой ранее созданный профиль в новой вкладке
              - Кнопка закрытия **[✕]** на каждой вкладке с быстрым подтверждением.
              - Мгновенное переключение между серверами и профилями в один клик прямо из верхней панели.

            - **👥 Менеджер мультипрофилей и клонирование:**
              - Полная изоляция списков серверов и настроек между профилями.
              - Дублирование серверов и паролей при клонировании профиля.
          draft: false
          prerelease: false
          files: |
            build/outputs/apk/debug/*.apk
            TeamTalkNext-5.27.20-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
