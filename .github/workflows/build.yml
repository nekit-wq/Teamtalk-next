name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkProPlus-5.26.5-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.26.5' }}
          name: "TeamTalk Pro Plus v5.26.5"
          body: |
            ### TeamTalk Pro Plus v5.26.5

            #### Список изменений:
            - **🔙 Исправлена навигация по кнопке «Перейти вверх» (Home/Up):**
              - Нажатие на стрелку «Перейти вверх» в шапке окна сервера (`MainActivity`) теперь корректно выполняет действие «Назад» (поднимается по дереву каналов или выходит в список серверов).
              - Исправлен критический баг Android `parentActivityName`, из-за которого нажатие «Перейти вверх» в Списке пользователей (`OnlineUsersActivity`) или в чате открывало фантомное дублирующее окно сервера с надписью «нет соединения».
              - Корректная обработка кнопки «Перейти вверх» во всех дочерних экранах (Список пользователей, Статистика сервера, Бан-листы).
            - **🧹 Чистые настройки:**
              - Простое и аккуратное поле «Имя клиента» в «Настройки ➔ Общие».
            - **⚙️ Настройка кнопки «Назад»:**
              - Опция «Сворачивать по кнопке «Назад»» в Настройках (по умолчанию — выход к списку серверов).
            - **🔝 Расположение меню:**
              - Пункт «Настройки» находится внизу меню.
            - **🌐 Публикация серверов на BearWare.dk:**
              - Долгий тап на сервер в списке.
          draft: false
          prerelease: false
          files: |
            build/outputs/apk/debug/*.apk
            TeamTalkProPlus-5.26.5-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
