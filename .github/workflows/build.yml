name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          ./gradlew assembleDebug --build-cache --stacktrace 2>&1 | tee gradle_err.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload Failure Log to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure-log
          name: "Build Failure Log"
          files: gradle_err.log
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkNext-5.28.4-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.28.4' }}
          name: "TeamTalk Next v5.28.4"
          body: |
            ### TeamTalk Next v5.28.4 — Стереомикрофон по умолчанию, стриминг и фиксы Android 14+

            #### 🎙 Улучшения микрофона и звука:
            - **Стереомикрофон по умолчанию:** Захват голоса теперь по умолчанию запускается в режиме Stereo (2 канала) через стереофонические аудиоисточники устройства.
            - **Автоматический Fallback:** Если устройство физически не поддерживает 2 канала, захват плавно и автоматически переключается в моно без сбоев.
            - **Сохранение стереобазы:** Системные фильтры Android AEC/NS автоматически отключаются в режиме стерео, предотвращая схлопывание каналов в моно.

            #### 🛡 Стабильность и поддержка Android 14–16 (SDK 34–36):
            - **Фикс MediaProjection SecurityException:** Корректное динамическое повышение типа Foreground Service до `FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION` перед захватом экрана.
            - **Фикс ClassCastException:** Безопасное чтение числовых и строковых настроек микрофона из `SharedPreferences`.

            #### 📦 Обновление версий и библиотек:
            - **Версия приложения:** Обновлена до `5.28.4` (build `437`).
            - **Нативные библиотеки:** Встроенные библиотеки `libTeamTalk5-jni.so` (arm64-v8a, armeabi-v7a) синхронизированы и пропатчены до версии `5.28.4`.
          draft: false
          prerelease: false
          files: |
            build/outputs/apk/release/*.apk
            TeamTalkNext-5.28.4-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
