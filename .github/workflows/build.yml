name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          build-root-directory: client
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x client/gradlew

      - name: Build APKs
        working-directory: client
        run: |
          ./gradlew assembleDebug assembleRelease --build-cache --stacktrace 2>&1 | tee ../gradle_err.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload Failure Log to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure-log
          name: "Build Failure Log"
          files: gradle_err.log
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            client/build/outputs/apk/release/*.apk
            client/build/outputs/apk/debug/*.apk
            client/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkNext-5.28.7-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.28.7' }}
          name: "TeamTalk Next v5.28.7"
          body: |
            ### TeamTalk Next v5.28.7 — Экспорт .tt аккаунтов, одиночный экспорт серверов и параллельная многопоточная сборка

            #### 📤 Экспорт .tt учетных записей:
            - **Экспорт аккаунтов сервера:** В меню управления пользователями («Учетные записи») добавлена возможность экспорта любой учетной записи в файл `.tt` с автоматическим заполнением параметров сервера, логина и пароля.
            - **Интеграция с Android Share Sheet:** Экспортированный `.tt` файл сразу же открывается в системном диалоге «Поделиться» для быстрой отправки в мессенджеры или сохранения в проводнике.

            #### 🖥 Экспорт отдельных серверов:
            - **Одиночный экспорт из режима выделения:** При выборе одного сервера в списке серверов генерируется красивый именованный `.tt` файл и открывается окно быстрой отправки.

            #### ⚡️ Оптимизация сборки:
            - Включена полноценная параллельная многопоточная сборка на всех ядрах процессора (`org.gradle.parallel=true`, `org.gradle.workers.max=8`).

            #### 📦 Версии:
            - **Версия приложения:** Обновлена до `5.28.7` (номер сборки `440`).
          draft: false
          prerelease: false
          files: |
            client/build/outputs/apk/release/*.apk
            client/build/outputs/apk/debug/*.apk
            tests/output/*.jar
            TeamTalkNext-5.28.7-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
