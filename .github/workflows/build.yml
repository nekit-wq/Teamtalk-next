name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          ./gradlew assembleDebug --build-cache --stacktrace 2>&1 | tee gradle_err.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload Failure Log to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure-log
          name: "Build Failure Log"
          files: gradle_err.log
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkNext-5.27.28-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.27.28' }}
          name: "TeamTalk Next v5.27.28"
          body: |
            ### TeamTalk Next v5.27.28 — Индикация трансляции, оптимизация TTS и радио

            #### 🛠 Новые возможности и исправления:
            - **🔴 Отображение статуса трансляции у пользователя:**
              - Когда пользователь транслирует медиа/радио, в его строке в списке канала отображается статус «🔴 Транслирует».
            - **🔇 Отключение навязчивой озвучки перемещений по каналам:**
              - Озвучка собственных входов/выходов из каналов («Вы вошли в канал...», «Вы вышли из канала...») и перемещений других пользователей теперь выключена по умолчанию (`false`) и легко настраивается в Настройки -> Озвучка.
            - **📻 Упрощенный интерфейс интернет-радио и мгновенная остановка с 1 нажатия:**
              - Убрана перегруженность списком станций (оставлены топовые пресеты + поле для ввода/вставки любой ссылки и добавления своих станций).
              - Кнопка «Стоп» теперь мгновенно останавливает как локальный плеер, так и трансляцию в канал в одно нажатие.
          draft: false
          prerelease: false
          files: |
            build/outputs/apk/debug/*.apk
            TeamTalkNext-5.27.28-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
