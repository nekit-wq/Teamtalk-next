name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_err.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload Failure Log to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure-log
          name: "Build Failure Log"
          files: gradle_err.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkNext-5.27.11-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.27.11' }}
          name: "TeamTalk Next v5.27.11"
          body: |
            ### TeamTalk Next v5.27.11 — Обновление и синхронизация с TeamTalk 5.23

            #### 🚀 Главные нововведения и улучшения:
            - **Синхронизация и портирование всех новых возможностей TeamTalk 5.23:**
              - **Индикатор набора текста («User is typing…»):** отправка и прием статуса набора сообщения в реальном времени, звуковое оповещение `typing.ogg`, всплывающий статус в заголовке личной переписки и озвучка через TTS.
              - **Объединение длинных сообщений (Multipart Messages):** автоматическая склейка фрагментированных сообщений `bMore` в единый связный текст в чатах и личных диалогах.
              - **Управление правами вещания в учебных классах (Classroom Channels):** быстрое включение/отключение вещания голоса, видео, экрана, медиафайлов и текстовых сообщений для всех участников комнаты («Разрешить/Запретить всем»).
              - **Озвучка перемещений в других комнатах через TTS:** отслеживание входов и выходов пользователей в любые каналы сервера с гибким включением в настройках TTS.
              - **Отображение статуса администратора и стримера:** озвучивание и индикация для скринридеров (TalkBack) ролей «Администратор» и «Транслирует медиафайл».
              - **Диалог быстрой смены ника и статуса:** быстрое переключение между статусами «Доступен», «Отошел», «Вопрос» с установкой статусного сообщения и ника из главного меню.
              - **Интеллектуальный авто-скролл в чате (Smart Scrolling):** чат не сбивает позицию чтения при поступлении новых сообщений, если пользователь просматривает историю выше.
              - **Приглушение звуков при исходящих вызовах:** корректное отключение звуков при звонках (`CALL_STATE_OFFHOOK`).

            - **⚡️ Улучшенная перемотка и трансляция медиафайлов на сервере:**
              - **Плавная перемотка серверного стрима:** перемотка через SeekBar в реальном времени (`updateStreamingMediaFileToChannel` с обновлением `uOffsetMSec`), устранение сбоев и зависаний.
              - **Пауза и возобновление трансляции на сервере:** возможность приостанавливать и возобновлять стрим медиафайла как из экрана стриминга (`btnPlayPause`), так и прямо из верхнего меню `MainActivity` («Приостановить / Возобновить трансляцию»).
              - **Синхронизация прогресса стрима:** точное отображение текущей позиции и общей длительности в плеере во время трансляции в канал.
          draft: false
          prerelease: false
          files: |
            build/outputs/apk/debug/*.apk
            TeamTalkNext-5.27.11-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
