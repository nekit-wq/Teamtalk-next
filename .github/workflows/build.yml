name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_err.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload Failure Log to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure-log
          name: "Build Failure Log"
          files: gradle_err.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkProPlus-5.26.11-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.26.11' }}
          name: "TeamTalk Pro Plus v5.26.11"
          body: |
            ### TeamTalk Pro Plus v5.26.11

            #### Список изменений:
            - **👥 Отображение пользователей «под сервером» (вне каналов):**
              - Полностью перенесена функция из TeamTalk Plus для отображения пользователей, находящихся вне каналов (под сервером, channel ID = 0).
            - **📁 Полноценная навигация в корень сервера («под сервер»):**
              - При нажатии кнопки «Вверх» / «Назад» из корневого канала теперь открывается представление «Корневой сервер / под сервер», где отображаются пользователи вне каналов и папка корневого канала.
              - Повторное нажатие кнопки «Вверх» / «Назад» из корня сервера выходит в список серверов.
            - **🚨 Встроенный полноэкранный Crash Reporter:**
              - Кнопка «Скопировать ошибку» в один клик.
            - **📦 Полный комплект нативных библиотек под все 4 ABI:**
              - `armeabi-v7a` (32-бит ARM), `arm64-v8a` (64-бит ARM), `x86` (32-бит), `x86_64` (64-бит).
          draft: false
          prerelease: false
          files: |
            build/outputs/apk/debug/*.apk
            TeamTalkProPlus-5.26.11-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
