name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_err.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload Failure Log to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure-log
          name: "Build Failure Log"
          files: gradle_err.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkNext-5.27.5-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.27.5' }}
          name: "TeamTalk Next v5.27.5"
          body: |
            ### TeamTalk Next v5.27.5

            #### Список изменений и нововведений:
            - **Локальная история сообщений (Chat History):**
              - Полноценная локальная база данных SQLite для сохранения истории входящих и исходящих сообщений канала, личных сообщений и системных логов.
              - Автоматическая подгрузка последних сообщений из базы данных при подключении к серверу и переходе по каналам.
              - Быстрый поиск в реальном времени, фильтрация (Все / Канал / Личные), копирование сообщений и экспорт всей переписки в файл .txt.
              - Кнопка быстрого доступа к истории прямо в панели ввода чата и в главном меню приложения.
            - **Мониторинг качества сети (Network Quality Monitor):**
              - Вычисление интегрального индекса стабильности соединения (0–100%) в реальном времени.
              - Замер сетевых параметров: UDP/TCP Ping (текущий, минимальный, средний, максимальный), среднеквадратичный джиттер и таймеры активности сокетов.
              - Точный подсчет потерь входящих пакетов аудиопотока собеседников (RX), медиафайлов и кадров видео.
              - Раздельный мониторинг микрофона (TX): текущий статус передачи (активна / ожидание) и скорость отправки.
              - Отображение активных говорящих участников в канале.
              - Детализация скорости (RX/TX) и общего объема данных по типам потоков (голос, видео, медиа, экран).
              - Генерация и копирование диагностического отчета в буфер обмена.
            - **Исправления и оптимизация:**
              - Исправлен алгоритм расчета качества связи и исключены ложные падения оценки при тишине в канале.
              - Настроен активный опрос задержки для поддержания актуальной сетевой статистики.
          draft: false
          prerelease: false
          files: |
            build/outputs/apk/debug/*.apk
            TeamTalkNext-5.27.5-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
