name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Print Failure Info
        if: failure()
        run: |
          echo "=== Gradle Logs / Reports ==="
          find build -type f -name "*.txt" -o -name "*.log" | xargs head -n 50 || true

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkProPlus-5.26.10-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.26.10' }}
          name: "TeamTalk Pro Plus v5.26.10"
          body: |
            ### TeamTalk Pro Plus v5.26.10

            #### Список изменений:
            - **🚨 Встроенный полноэкранный экран перехвата ошибок (Crash Reporter):**
              - Если в приложении возникнет любой непредвиденный сбой или вылет, вместо закрытия теперь открывается информативное окно с полным текстом ошибки и кнопкой **«Скопировать ошибку»**, чтобы можно было мгновенно отправить лог разработчику в один клик.
            - **🛑 Полное закрытие сервера при выходе из приложения:**
              - Убрано принудительное удержание сервера в фоне. При закрытии окна сервера сессия полностью сбрасывается, соединение чисто закрывается.
            - **🛡 Null-safe защита при завершении сервиса и навигации:**
              - Добавлены проверки на null в `closeTeamTalkService`, `onStop`, `onDestroy` и обработчиках кнопок «Назад» / «Вверх».
            - **📦 Полный комплект нативных библиотек под все 4 ABI:**
              - `armeabi-v7a` (32-бит ARM), `arm64-v8a` (64-бит ARM), `x86` (32-бит), `x86_64` (64-бит).
          draft: false
          prerelease: false
          files: |
            build/outputs/apk/debug/*.apk
            TeamTalkProPlus-5.26.10-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
