name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          build-root-directory: client
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x client/gradlew

      - name: Build APKs
        working-directory: client
        run: |
          ./gradlew assembleDebug assembleRelease --build-cache --stacktrace 2>&1 | tee ../gradle_err.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload Failure Log to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure-log
          name: "Build Failure Log"
          files: gradle_err.log
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            client/build/outputs/apk/release/*.apk
            client/build/outputs/apk/debug/*.apk
            client/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkNext-5.28.5-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.28.5' }}
          name: "TeamTalk Next v5.28.5"
          body: |
            ### TeamTalk Next v5.28.5 — Выложена вся кодовая база проекта, вкладка личных сообщений, 9-полосный эквалайзер микрофона и выбор микрофона звонка

            > [!NOTE]
            > **Выложена вся кодовая база проекта!** Репозиторий теперь содержит полный стек:
            > - **`client/`** — Android-клиент TeamTalk Next со всеми возможностями и модификациями.
            > - **`sdk/`** — исходный код TeamTalk 5 SDK (C++ core, JNI, Java, .NET, Python, Rust биндинги).
            > - **`server/`** — серверные компоненты (yt-dlp stream resolver).

            #### 💬 Новая вкладка «Личные сообщения» (Private Chats):
            - **Вкладка «Личные»:** Добавлена 5-я вкладка в главный интерфейс со списком всех пользователей, когда-либо писавших в ЛС.
            - **Синхронизация и фильтры:** Удобный переключатель режима отображения:
              - *На сервере* — сообщения текущей активной сессии сервера.
              - *Вся история* — полная сохранённая локальная переписка.
              - *В сети* — быстрый фильтр по контактам онлайн.
            - **Компактный интерфейс:** Полное сохранение оригинальной высоты и стилей системных вкладок.

            #### 🎙 Улучшения микрофона и эквалайзера:
            - **9-полосный эквалайзер микрофона:** Полноценная программная обработка частотных полос микрофона в реальном времени на базе biquad IIR-фильтров.
            - **Выбор «Микрофона звонка»:** Добавлена возможность выбора микрофона голосовой связи без принудительного переключения аудиосистемы в режим вызова.
            - **Стерео-микрофон:** Корректная запись со стерео-микрофонов и плавный откат в моно на устройствах без аппаратного стерео.
            - **Параллельная запись (Telegram и др.):** Устранено глушение голосовых сообщений сторонними приложениями при включённой передаче или голосовой активации.

            #### 📦 Обновление версий и библиотек:
            - **Версия приложения:** Обновлена до `5.28.5` (номер сборки `438`).
            - **Нативные библиотеки:** Встроенные библиотеки `libTeamTalk5-jni.so` (arm64-v8a, armeabi-v7a) синхронизированы и пропатчены до версии `5.28.5`.
          draft: false
          prerelease: false
          files: |
            client/build/outputs/apk/release/*.apk
            client/build/outputs/apk/debug/*.apk
            TeamTalkNext-5.28.5-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
