name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Print Failure Info
        if: failure()
        run: |
          echo "=== Gradle Logs / Reports ==="
          find build -type f -name "*.txt" -o -name "*.log" | xargs head -n 50 || true

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkProPlus-5.26.7-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.26.7' }}
          name: "TeamTalk Pro Plus v5.26.7"
          body: |
            ### TeamTalk Pro Plus v5.26.7

            #### Список изменений:
            - **📦 Полный комплект нативных библиотек для всех архитектур:**
              - Добавлены полноценные нативные библиотеки для `armeabi-v7a` (32-бит ARM), `arm64-v8a` (64-бит ARM), `x86` (32-бит) и `x86_64` (64-бит).
              - В универсальный APK `TeamTalkAndroid-universal-debug.apk` теперь гарантированно упакованы библиотеки под любые 32-битные и 64-битные Android устройства.
            - **🔙 Исправлена навигация по кнопке «Назад» и стрелке «Перейти вверх» (Home/Up):**
              - Кнопка «Назад» и кнопка «Перейти вверх» теперь надежно и чисто отключаются от сервера и возвращают в список серверов без крашей, подвисаний или пустых экранов.
            - **📱 Восстановление работающего сервера при открытии из фона:**
              - Если сервер работает в фоне (приложение свернуто жестом/домой), открытие TeamTalk с иконки на рабочем столе сразу возвращает вас в окно активного сервера без сброса соединения.
            - **🌐 Публикация сервера прямо из меню сервера:**
              - В меню сервера (кнопка «Ещё» / три точки) добавлен пункт «Опубликовать сервер».
          draft: false
          prerelease: false
          files: |
            build/outputs/apk/debug/*.apk
            TeamTalkProPlus-5.26.7-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
