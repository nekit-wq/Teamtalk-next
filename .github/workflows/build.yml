name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleDebug -x test -x lint --no-daemon --stacktrace

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkProPlus-5.26.4-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.26.4' }}
          name: "TeamTalk Pro Plus v5.26.4"
          body: |
            ### TeamTalk Pro Plus v5.26.4

            #### Список изменений:
            - **🚀 Обновлен нативный движок BearWare SDK до версии 5.35.0:**
              - Обновлены нативные бинарные библиотеки (`libTeamTalk5-jni.so`, `libTeamTalk5.so`) и `TeamTalk5.jar` под все процессорные архитектуры (ARM64, ARMv7, x86, x86_64).
              - Теперь протокол и сервер определяют клиент с актуальной версией 5.35.0 (вместо старой 5.22.0).
            - **🧹 Упрощены настройки клиента:**
              - Оставлено чистое поле ввода названия клиента («Имя клиента»).
            - **⚙️ Настройка поведения кнопки «Назад»:**
              - В «Настройки ➔ Общие» доступна опция *«Сворачивать по кнопке Назад»*.
              - По умолчанию нажатие «Назад» выходит к списку серверов и корректно отключается от сервера.
            - **🔝 Расположение меню:**
              - Пункт «Настройки» находится внизу меню действий.
            - **🌐 Публикация серверов на BearWare.dk:**
              - Функция «Опубликовать сервер» по долгому тапу на любой сервер в списке.
          draft: false
          prerelease: false
          files: |
            build/outputs/apk/debug/*.apk
            TeamTalkProPlus-5.26.4-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
