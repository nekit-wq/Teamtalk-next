name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          build-root-directory: client
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x client/gradlew

      - name: Build APKs
        working-directory: client
        run: |
          ./gradlew assembleDebug assembleRelease --build-cache --stacktrace 2>&1 | tee ../gradle_err.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload Failure Log to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure-log
          name: "Build Failure Log"
          files: gradle_err.log
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            client/build/outputs/apk/release/*.apk
            client/build/outputs/apk/debug/*.apk
            client/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkNext-5.28.10-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.28.10' }}
          name: "TeamTalk Next v5.28.10"
          body: |
            ### TeamTalk Next v5.28.10 — Устранение краша при удалении учетных записей, экспорт .tt с кириллицей и выбор начального канала

            #### 💥 Устранение критического краша:
            - Устранен вылет клиента у всех подключенных администраторов при удалении учетной записи на сервере.
            - В нативной библиотеке C++ (`TTMsgQueue::OnRemoveUserAccount`) буфер `UserAccount` теперь полностью зануляется перед копированием логина, предотвращая передачу невалидного UTF-8 в Java ART runtime.
            - В клиентском интерфейсе удаленная учетная запись теперь динамически удаляется из списка без падений.

            #### 📁 Экспорт настроек серверов (.tt):
            - Устранена замена русских букв на нижние подчеркивания (`______.tt`) при экспорте конфигураций .tt.
            - Добавлен удобный диалог ввода/подтверждения имени файла с поддержкой кириллицы перед сохранением.

            #### 🚪 Начальный канал новых аккаунтов:
            - При создании учетной записи начальным каналом по умолчанию назначается корневой канал (`/`), исключая ситуацию «улета под сервер».
            - Поле выбора начального канала переведено в диалоговый селектор: при нажатии на поле сразу открывается список каналов сервера с корневым каналом во главе, без лишнего всплывания экранной клавиатуры.

            #### 📦 Версии:
            - **Версия приложения:** Обновлена до `5.28.10` (номер сборки `443`).
            - **Версия нативной библиотеки:** Обновлена до `5.28.10`.
          draft: false
          prerelease: false
          files: |
            client/build/outputs/apk/release/*.apk
            client/build/outputs/apk/debug/*.apk
            tests/output/*.jar
            TeamTalkNext-5.28.10-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
