name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkProPlus-5.35-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.35' }}
          name: "TeamTalk Pro Plus v5.35"
          body: |
            ### TeamTalk Pro Plus v5.35

            #### Список изменений:
            - **Полностью стабильный нативный звук:** микрофон и динамик работают чисто, без перехода в режим звонка и без артефактов связи.
            - **Улучшенный механизм обновлений из приложения:**
              - Всегда проверяет и находит самый последний актуальный релиз с GitHub API.
              - Умный выбор правильного APK (Universal / ARM64).
              - Кнопка «Проверить обновления» в настройках гарантированно предлагает установить свежий релиз.
            - **Кнопка канала «Покинуть канал» / «Войти в канал»** на верхней панели перед меню «Ещё».
            - **Кнопка «Mute TTS»** для быстрого включения/отключения синтезатора речи.
            - **Постоянная цифровая подпись APK.**
          draft: false
          prerelease: false
          files: |
            build/outputs/apk/debug/*.apk
            TeamTalkProPlus-5.35-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
