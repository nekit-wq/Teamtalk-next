name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_err.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload Failure Log to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure-log
          name: "Build Failure Log"
          files: gradle_err.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkProPlus-5.27.0-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.27.0' }}
          name: "TeamTalk Pro Plus v5.27.0"
          body: |
            ### TeamTalk Pro Plus v5.27.0

            #### Список изменений и исправлений:
            - **⚡ Бесшовное переключение сети (Wi-Fi ↔ LTE/3G ↔ VPN):**
              - Добавлен системный мониторинг активного сетевого маршрута (`ConnectivityManager.NetworkCallback`).
              - При переключении между Wi-Fi, мобильной сетью или VPN клиент мгновенно переподключается к серверу без ожидания 30-секундного тайм-аута и зависания аудиопотоков.
              - Автоматически сохраняется и восстанавливается текущий канал пользователя после переподключения.
              - Добавлена опция «Бесшовное переключение сети» в «Настройки -> Соединение» (включена по умолчанию).
            - **🐛 Исправлен выход из сервера и фоновое фантомное переподключение:**
              - Устранена ошибка, при которой после выхода из сервера клиент через 5 секунд в фоне переподключался обратно из-за автоматического таймера переподключения при потере соединения.
              - При выходе теперь гарантированно снимается уведомление, останавливается foreground-сервис, закрываются аудиоустройства и освобождаются блокировки `WakeLock`/`WifiLock`.
            - **📁 Логичная двухэтапная навигация («Перейти вверх» / Home / «Назад»):**
              - Первое нажатие кнопки «Перейти вверх» (или «Назад») из корневого канала переводит пользователя в пространство под корнем («Корень сервера»).
              - Повторное нажатие «Перейти вверх» (или «Назад») на уровне «Корень сервера» осуществляет чистый выход из сервера в список серверов.
            - **🧹 Очистка меню «Ещё»:**
              - Удален избыточный пункт «Отключиться».
          draft: false
          prerelease: false
          files: |
            build/outputs/apk/debug/*.apk
            TeamTalkProPlus-5.27.0-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
