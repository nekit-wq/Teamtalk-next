name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          ./gradlew assembleDebug --build-cache --stacktrace 2>&1 | tee gradle_err.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload Failure Log to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure-log
          name: "Build Failure Log"
          files: gradle_err.log
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkNext-5.28.3-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.28.3' }}
          name: "TeamTalk Next v5.28.3"
          body: |
            ### TeamTalk Next v5.28.3 — Массовые действия, исправление Audio Ducking и обновление нативного ядра

            #### 👥 Массовые действия над пользователями:
            - **Экран «Выбрать пользователей»:** Новый удобный полноэкранный интерфейс для выполнения действий сразу над несколькими пользователями.
            - **Управление через верхнее меню:** Кнопки «Далее», «Выбрать всех», «Снять выбор» и фильтр («Все пользователи» / «В моем канале») аккуратно интегрированы в верхнюю панель ActionBar.
            - **События в реальном времени:** Список пользователей и статус выбора автоматически обновляются при подключении, отключении и смене каналов.
            - **Групповые операции:** Массовая отправка личных сообщений, заглушение/включение микрофона и медиа, изменение громкости, перемещение/кик из канала, кик/бан на сервере и управление подписками.
            - **Edge-to-Edge:** Корректный расчет системных отступов на современных версиях Android.

            #### 🖥 Массовые действия над серверами (CAB):
            - **Множественный выбор серверов:** Активация режима выбора по долгому нажатию на сервер в списке.
            - **Контекстное меню действий:** Возможность массового пинга, экспорта серверов в файл `.tt` и группового удаления.

            #### 🔊 Исправление Audio Ducking (Глушение медиафайлов):
            - **Корректное восстановление звука:** Исправлена ошибка, из-за которой громкость медиафайлов не возвращалась к исходному уровню после завершения речи.
            - **Потокобезопасность:** Отслеживание говорящих переведено на потокобезопасные структуры данных, исключающие зависание состояния приглушения.
            - **Гарантированный возврат громкости:** Громкость всех участников канала гарантированно восстанавливается до сохранённых индивидуальных значений.

            #### 📦 Обновление версий и библиотек:
            - **Версия приложения:** Обновлена до `5.28.3` (build `436`).
            - **Нативные библиотеки:** Встроенные библиотеки `libTeamTalk5-jni.so` (arm64-v8a, armeabi-v7a) синхронизированы и пропатчены до версии `5.28.3`.
            - **Очистка кода:** Полностью удалена неиспользуемая служба аппаратных кнопок.
          draft: false
          prerelease: false
          files: |
            build/outputs/apk/debug/*.apk
            TeamTalkNext-5.28.3-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
