name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkProPlus-5.25-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.25' }}
          name: "TeamTalk Pro Plus v5.25"
          body: |
            ### TeamTalk Pro Plus v5.25

            #### Список изменений:
            - **Маскировка версии и ОС клиента:** быстрый выбор пресетов (Windows 5.28.0, 5.15.0, 5.8.2, macOS, Linux, iOS, Android, либо любая произвольная строка).
            - **Открытие файлов `.tt` («Открыть с помощью» / Share):** отображение всех параметров сервера (название, хост/IP, TCP/UDP порты, логин, пароль, канал, шифрование) с возможностью импорта в список или прямого быстрого подключения без сохранения.
            - **Встроенная автопроверка обновлений с GitHub Releases:** проверка при запуске и через меню/настройки, показ описания релиза, опция «Больше не напоминать», скачивание APK с прогресс-баром и запуск установки внутри приложения.
            - **Исправление шумоподавления и микрофона:** исправлен сброс WebRTC Noise Suppression, эхоподавления (AEC) и АРУ при переподключении, входе на сервер и смене каналов. Настройки теперь сохраняются и применяются стабильно.
          draft: false
          prerelease: false
          files: |
            build/outputs/apk/debug/*.apk
            TeamTalkProPlus-5.25-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
