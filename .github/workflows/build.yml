name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          build-root-directory: client
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x client/gradlew

      - name: Build APKs
        working-directory: client
        run: |
          ./gradlew assembleDebug assembleRelease --build-cache --stacktrace 2>&1 | tee ../gradle_err.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload Failure Log to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure-log
          name: "Build Failure Log"
          files: gradle_err.log
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            client/build/outputs/apk/release/*.apk
            client/build/outputs/apk/debug/*.apk
            client/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkNext-5.28.8-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.28.8' }}
          name: "TeamTalk Next v5.28.8"
          body: |
            ### TeamTalk Next v5.28.8 — Исправление прав учетных записей, фикс FGS MediaProjection на Android 14-16, стабильный стриминг и мгновенный импорт .tt серверов

            #### 👤 Права новых учетных записей:
            - При создании новой учетной записи на сервере автоматически назначаются стандартные пользовательские права (передача голоса, медиа-файлов, видео, сообщений, загрузка файлов).

            #### 🛡 Исправление краша FGS MediaProjection (Android 14/15/16):
            - Устранен SecurityException при старте Foreground Service с типом mediaProjection. Флаг mediaProjection теперь активируется только при явном запуске демонстрации экрана, с автоматическим fallback на microphone|mediaPlayback.

            #### 🎙 Стабильность звука при стриминге:
            - Устранено постоянное мигание и выключение микрофона во время трансляций (кэширование видеобуфера экрана без GC-фризов, защита от сброса передачи при стриминге, увеличение порога ошибок AudioRecord).

            #### 📁 Мгновенный импорт и отображение .tt серверов:
            - Импортированные через .tt серверы мгновенно сохраняются и отображаются в списке серверов сразу после выхода из сервера без необходимости перезапуска приложения.
            - Добавлена опция автоматического сохранения и подключения при открытии .tt файла.

            #### 📦 Версии:
            - **Версия приложения:** Обновлена до `5.28.8` (номер сборки `441`).
          draft: false
          prerelease: false
          files: |
            client/build/outputs/apk/release/*.apk
            client/build/outputs/apk/debug/*.apk
            tests/output/*.jar
            TeamTalkNext-5.28.8-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
