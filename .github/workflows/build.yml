name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_err.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload Failure Log to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure-log
          name: "Build Failure Log"
          files: gradle_err.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkNext-5.27.13-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.27.13' }}
          name: "TeamTalk Next v5.27.13"
          body: |
            ### TeamTalk Next v5.27.13 — Смена версии клиента на лету и автосинхронизация

            #### 🚀 Главные нововведения:
            - **⚡️ Динамическая смена версии клиента прямо из приложения (Runtime Version Spoofing):**
              - Добавлена возможность менять версию клиента на любую желаемую (например, `5.28.0`, `5.23.0` и т.д.) прямо в интерфейсе приложения без пересборки APK.
              - Патчинг строки версии выполняется напрямую в оперативной памяти (RAM) нативной библиотеки `libTeamTalk5-jni.so`.
              - Доступ к диалогу смены версии:
                - В **Настройках ➔ О программе ➔ Сменить версию клиента**
                - По клику на строчку версии в главном окне списка серверов
              - Выбранная версия сохраняется в настройках и автоматически подставляется при последующих запусках приложения. Есть кнопка «По умолчанию» для быстрого сброса.

            - **🤖 Полная автоматизация сборки нативных библиотек:**
              - В Gradle внедрен автоматический пайплайн синхронизации версий во всех архитектурах (`arm64-v8a`, `armeabi-v7a`, `x86_64`, `x86`).
          draft: false
          prerelease: false
          files: |
            build/outputs/apk/debug/*.apk
            TeamTalkNext-5.27.13-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
