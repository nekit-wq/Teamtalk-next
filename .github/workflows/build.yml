name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_err.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload Failure Log to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure-log
          name: "Build Failure Log"
          files: gradle_err.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkNext-5.27.9-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.27.9' }}
          name: "TeamTalk Next v5.27.9"
          body: |
            ### TeamTalk Next v5.27.9

            #### Список изменений и нововведений:
            - **Гибкая настройка папок для каждого сервера и комнаты:**
              - Добавлены раздельные переключатели «Создавать папку для сервера» и «Создавать папку для комнаты».
              - Если опции отключены, записи сохраняются в общую папку записей, как обычно.
            - **Встроенный менеджер и плеер записей:**
              - Экран «Записи» с поиском в реальном времени, фильтрацией, аудиоплеером (Play/Pause, перемотка +-5 сек, SeekBar) и кнопками «Поделиться», «Переименовать», «Удалить».
            - **Непрерывная сквозная запись всей сессии:**
              - Режим непрерывной записи при переходе между комнатами сервера без прерывания сессии.
            - **Умная авто-пауза при тишине:**
              - Автоматическая пауза записи при отсутствии голоса в канале и мгновенное возобновление при появлении речи.
            - **Мультитрек:**
              - Опция сохранения отдельных дорожек участников.
          draft: false
          prerelease: false
          files: |
            build/outputs/apk/debug/*.apk
            TeamTalkNext-5.27.9-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
