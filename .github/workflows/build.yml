name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkProPlus-5.26.3-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.26.3' }}
          name: "TeamTalk Pro Plus v5.26.3"
          body: |
            ### TeamTalk Pro Plus v5.26.3

            #### Список изменений:
            - **⚙️ Настройка поведения кнопки «Назад»:**
              - В «Настройки ➔ Общие» добавлена опция *«Сворачивать по кнопке Назад»*.
              - При выключенной опции (по умолчанию): нажатие «Назад» выходит из комнаты к списку серверов и корректно отключается от сервера.
              - При включенной опции: нажатие «Назад» сворачивает приложение в фон (`moveTaskToBack`), не прерывая связь.
            - **🔝 Улучшено расположение меню:**
              - Пункт «Настройки» перенесен в самый низ меню действий и списка серверов (больше не отображается первым).
            - **🌐 Публикация серверов на BearWare.dk:**
              - Добавлена функция «Опубликовать сервер» по долгому тапу на любой сервер в списке!
              - Автоматическая генерация XML-спецификации, отправка в каталог BearWare и кнопка копирования верификационного тега `#teamtalkpublish#`.
            - **🎭 Продвинутая подмена версии и клиента:**
              - В «Настройки ➔ Общие» добавлен быстрый выбор шаблона клиента (Windows 64-bit v5.35.0, v5.34.8, v5.28.0, macOS, iOS, Android, Linux или собственный ввод).
            - **⚡️ Устойчивость в фоне и стабильное переключение окон:**
              - Бесшовное возвращение в комнату при повторном открытии с рабочего стола без сброса соединения.
              - Постоянные `WakeLock` и `WifiLock` сервиса, кнопка **«Работа в фоне без ограничений»**.
            - **Полностью стабильный нативный звук** без перехода в режим звонка.
          draft: false
          prerelease: false
          files: |
            build/outputs/apk/debug/*.apk
            TeamTalkProPlus-5.26.3-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
