name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_err.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload Failure Log to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure-log
          name: "Build Failure Log"
          files: gradle_err.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkNext-5.27.19-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.27.19' }}
          name: "TeamTalk Next v5.27.19"
          body: |
            ### TeamTalk Next v5.27.19 — Мультипрофили, щит производительности и улучшения проводника

            #### 🚀 Главные улучшения:
            - **👥 Менеджер мультипрофилей (как на ПК):**
              - Добавлена полноценная система профилей с независимыми списками серверов, никнеймами и настройками.
              - Возможность создания чистого профиля («➕ Новый профиль»), клонирования текущего («📋 Клонировать»), переименования и быстрого переключения.
              - Активный профиль отображается в шапке списка серверов.

            - **⚡️ Неблокирующее асинхронное подключение (Anti-Freeze):**
              - Подключение к серверам переведено в полностью асинхронный поток с индикатором статуса и возможностью отмены.
              - Полностью устранены зависания и зависания интерфейса (ANR) при плохом интернете, отсутствии сети или включённом VPN.

            - **📂 Улучшенный встроенный проводник TeamTalk:**
              - Добавлена кнопка **«➕ Создать папку»** с диалогом ввода имени.
              - Добавлено **меню сортировки файлов и папок** (по имени А-Я/Я-А, по дате изменения, по размеру).
              - Интеграция встроенного проводника при выборе аудиофайлов для трансляции медиа.

            - **🎧 Бесшовный возврат в окно активного стрима:**
              - При выходе из экрана стрима теперь можно мгновенно вернуться обратно в `StreamMediaActivity` через меню и уведомление для управления треком, паузой и перемоткой без сброса потока.

            - **🚀 Вкладка «Производительность и стабильность» в Настройках:**
              - Прямой вызов системного отключения оптимизации батареи (`Ignore Battery Optimization`).
              - Управление блокировкой сна процессора (CPU WakeLock) и высокопроизводительным режимом Wi-Fi (Wi-Fi Lock).
              - Максимальный приоритет фонового процесса для защиты от агрессивного завершения системой при блокировке экрана.
          draft: false
          prerelease: false
          files: |
            build/outputs/apk/debug/*.apk
            TeamTalkNext-5.27.19-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
