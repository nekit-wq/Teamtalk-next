name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_err.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload Failure Log to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure-log
          name: "Build Failure Log"
          files: gradle_err.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkNext-5.27.12-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.27.12' }}
          name: "TeamTalk Next v5.27.12"
          body: |
            ### TeamTalk Next v5.27.12 — Фоновая трансляция медиафайлов и стабильность плеера

            #### 🚀 Главные улучшения:
            - **🎧 Фоновая трансляция медиафайлов (Background Media Streaming):**
              - Трансляция аудио/видео файлов в канал больше **не прерывается** при выходе из экрана стриминга (`StreamMediaActivity`), возврате назад в `MainActivity`, переключении приложений или блокировке экрана.
              - Воспроизведение стабильно продолжается в фоновом сервисе `TeamTalkService`.

            - **🔄 Восстановление состояния плеера и UI:**
              - При повторном открытии экрана стриминга (`StreamMediaActivity`) или клике по меню «Трансляция» автоматически восстанавливается текущий трек, позиция на ползунке (SeekBar), прошедшее время и статус Пауза/Воспроизведение.

            - **🛑 Четкий контроль остановки стрима:**
              - Стрим останавливается исключительно по явному нажатию кнопки «Остановить» (`btnStop` / `action_stop`) или при выходе из канала/отключении от сервера.
          draft: false
          prerelease: false
          files: |
            build/outputs/apk/debug/*.apk
            TeamTalkNext-5.27.12-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
