name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          build-root-directory: client
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x client/gradlew

      - name: Build APKs
        working-directory: client
        run: |
          ./gradlew assembleDebug assembleRelease --build-cache --stacktrace 2>&1 | tee ../gradle_err.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload Failure Log to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure-log
          name: "Build Failure Log"
          files: gradle_err.log
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            client/build/outputs/apk/release/*.apk
            client/build/outputs/apk/debug/*.apk
            client/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          TAG_NAME="${{ github.ref_name }}"
          git archive --format=zip --output=TeamTalkNext-${TAG_NAME}-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "TeamTalk Next ${{ github.ref_name }}"
          body: |
            ### TeamTalk Next v5.29.2

            #### 🎨 Динамические цвета Monet и Material You:
            - **Поддержка Monet / Dynamic Color:** интерфейс адаптируется под системную палитру обоев (Android 12+), включая карточки, диалоги, индикаторы и панели управления.
            - **Полная адаптация Material You:** диалоговые окна переведены на MaterialAlertDialogBuilder, карточки и элементы управления обновлены в едином стиле Material 3.

            #### 👥 Несколько аккаунтов BearWare:
            - Одновременный вход в несколько учетных записей BearWare.
            - Меню быстрого выбора аккаунта при публикации сервера и других действиях.

            #### 🔘 Диалог подключения и интерфейс:
            - **Отмена подключения:** добавлена кнопка «Отмена» в диалог соединения, мгновенный сброс попыток подключения при нажатии «Назад» или касании вне диалога.
            - **Новая иконка приложения:** современная 3D-иконка в стиле Material You, при этом для официальных серверов в списке сохранена их классическая иконка.
            - **Векторные иконки в настройках:** обновлены тематические иконки для всех разделов настроек.

            #### 📦 Версии:
            - **Версия приложения:** `5.29.2` (код сборки `447`).
            - **Версия нативной библиотеки:** `5.29.2`.
          draft: false
          prerelease: false
          files: |
            client/build/outputs/apk/release/*.apk
            client/build/outputs/apk/debug/*.apk
            tests/output/*.jar
            TeamTalkNext-*-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
