name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          ./gradlew assembleDebug --build-cache --stacktrace 2>&1 | tee gradle_err.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload Failure Log to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure-log
          name: "Build Failure Log"
          files: gradle_err.log
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkNext-5.28.0-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.28.0' }}
          name: "TeamTalk Next v5.28.0"
          body: |
            ### TeamTalk Next v5.28.0 — Расширенный эквалайзер и аудиопроцессинг, стриминг YouTube и оптимизация производительности

            #### 🎛 Продвинутый эквалайзер и обработка микрофона (DSP):
            - **10-полосный эквалайзер:** Добавлен 10-полосный эквалайзер для микрофона с набором готовых пресетов (Flat, Voice Clarity, Bass Boost, Treble Boost, Radio Effect, Podcast, Low-Cut и др.) и гибкой ручной настройкой каждой частотной полосы.
            - **Выбор аудиодвижка микрофона:** Переключение между WebRTC Audio Processing (по умолчанию), Speex DSP и прямым аппаратным вводом (Direct Hardware).
            - **Настройки WebRTC DSP:** Расширенное управление шумоподавлением (уровни 0–3), эхоподавлением (AEC), предварительным усилением (Pre-Amp Gain) и режимами АРУ (AGC — фиксированный / адаптивный цифровой с настройкой Headroom и Max Gain).
            - **Настройки Speex DSP:** Ручная регулировка порога шумоподавления (dB), эхоподавления (dB) и уровня усиления AGC.
            - **Аппаратные эффекты:** Опция включения аппаратных звуковых эффектов устройства (SoundDeviceEffects).

            #### 📻 Стриминг медиа и YouTube:
            - **Интеграция YouTube Resolver:** Поддержка прямого аудио-стриминга по YouTube-ссылкам в канал через резолвер.
            - **Очистка кеша:** Автоматическое удаление временных файлов стриминга (`stream_temp_*`) при закрытии активности.
            - **Повышенная надежность:** Безопасное отвязывание сервиса и защита от зависаний фонового воспроизведения.

            #### ⚡ Оптимизация производительности и интерфейса:
            - **ViewHolder в адаптерах:** Внедрен паттерн ViewHolder для списков сообщений (`TextMessageAdapter`), файлов (`FileListAdapter`) и медиа (`MediaAdapter`) — плавный и быстрый скроллинг без подвисаний.
            - **База данных чата:** Оптимизированы запросы, пагинация и поиск сообщений в `ChatHistoryDbHelper`.
            - **Уменьшение размера APK:** Удалены неиспользуемые бинарные файлы x86/x86_64, сборка оптимизирована для arm64-v8a и armeabi-v7a.

            #### 🛡 Безопасность и исправления:
            - **Безопасный парсинг XML:** Устранена уязвимость XXE во всех компонентах парсинга XML с помощью `createSecureDocumentBuilderFactory()`.
            - **Улучшения сети и Bluetooth:** Стабильная работа сетевых запросов (UTF-8, увеличенный буфер) и корректная обработка Bluetooth Headset (SCO).
            - **Исправления UI:** Корректные проверки жизненного цикла в Activity и плавающих окнах.
          draft: false
          prerelease: false
          files: |
            build/outputs/apk/debug/*.apk
            TeamTalkNext-5.28.0-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
