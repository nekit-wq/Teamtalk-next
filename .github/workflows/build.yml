name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          ./gradlew assembleDebug --build-cache --stacktrace 2>&1 | tee gradle_err.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload Failure Log to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure-log
          name: "Build Failure Log"
          files: gradle_err.log
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkNext-5.27.30-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.27.30' }}
          name: "TeamTalk Next v5.27.30"
          body: |
            ### TeamTalk Next v5.27.30 — Полная оптимизация UI, исправление трансляции, PTT и проводника

            #### 🛠 Исправления и улучшения:
            - **⚡️ Ультра-быстрая оптимизация интерфейса (Redmi A3 и бюджетные смартфоны):**
              - В `UserPropActivity` внедрено полное кэширование элементов UI (ViewHolder) и единоразовая инициализация слушателей — свойства пользователя открываются мгновенно без задержек.
              - Геолокация пользователя по IP перенесена в асинхронный фоновый поток.
            - **⏹ Четкая остановка трансляции без ложных повторов:**
              - В `StreamMediaActivity` исправлен баг повторной активации кнопки остановки колбэком от SDK — остановка трансляции срабатывает четко с 1 нажатия.
            - **🎙 Мгновенная передача голоса (PTT) в 1 клик:**
              - Убран старый 800-мс дебаунс: теперь одиночное нажатие на кнопку передачи голоса сразу активирует/деактивирует микрофон без необходимости двойного клика.
            - **🔙 Одинарное нажатие кнопки «Назад» для выхода:**
              - В корне сервера кнопка «Назад» закрывает активность и отключается с 1 нажатия без повторного клика.
            - **📁 Выбор проводника файлов:**
              - В окне трансляции теперь строго учитывается настройка пользователя по умолчанию (Встроенный проводник TeamTalk / Системный проводник / Спрашивать).
          draft: false
          prerelease: false
          files: |
            build/outputs/apk/debug/*.apk
            TeamTalkNext-5.27.30-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
