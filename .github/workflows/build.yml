name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkProPlus-5.28-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.28' }}
          name: "TeamTalk Pro Plus v5.28"
          body: |
            ### TeamTalk Pro Plus v5.28

            #### Список изменений:
            - **Реальный спуфинг версии клиента в ядре TeamTalk:** добавлен нативный патчер `NativePatch`, динамически обновляющий строку версии в памяти `libTeamTalk5-jni.so`. Теперь при логине клиент отправляет серверу указанную пользователем версию (например `5.33.0`, `5.28.0` и т.д.), и сервер регистрирует её как настоящую `uVersion`.
            - **Отображение клиента в свойствах:** имя и версия клиента объединены в одну строку (например `шлюха 5.33.0`).
            - **Постоянная цифровая подпись APK:** стабильная установка обновлений поверх существующих версий без удаления.
          draft: false
          prerelease: false
          files: |
            build/outputs/apk/debug/*.apk
            TeamTalkProPlus-5.28-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
