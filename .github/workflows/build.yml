name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          build-root-directory: client
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x client/gradlew

      - name: Build APKs
        working-directory: client
        run: |
          ./gradlew assembleDebug assembleRelease --build-cache --stacktrace 2>&1 | tee ../gradle_err.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload Failure Log to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure-log
          name: "Build Failure Log"
          files: gradle_err.log
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            client/build/outputs/apk/release/*.apk
            client/build/outputs/apk/debug/*.apk
            client/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          TAG_NAME="${{ github.ref_name }}"
          git archive --format=zip --output=TeamTalkNext-${TAG_NAME}-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "TeamTalk Next ${{ github.ref_name }}"
          body: |
            ### TeamTalk Next v5.29.0 — Полный редизайн Material You, док-панели записи/трансляций и расширенный антиспам

            #### 🎙️ Док-панели записи и медиатрансляций (в стиле Telegram):
            - **Панель активной записи:** аккуратный мини-бар прямо под верхней панелью с индикатором, таймером в реальном времени, кнопками Пауза/Продолжить и Стоп.
            - **Бесшовная склейка звука при паузе:** при остановке и возобновлении записи звук продолжает писаться в один и тот же файл без разрывов и щелчков.
            - **Панель трансляций:** быстрый мониторинг и управление медиапотоками/демонстрацией экрана.

            #### 🛡️ Антиспам и постоянный список игнорирования:
            - **Персистентный черный список:** возможность добавлять пользователей в игнор по нику или логину аккаунта. Список надежно сохраняется на устройстве между перезапусками.
            - **Фильтры спама и флуда:** защита от массовых звуковых запросов и спама сообщениями.

            #### 🎨 Дизайн Google Material You (Material 3):
            - **Цветовые палитры:** чистый пастельный фон поверхностей, акцентный глубокий синий в светлой теме и пастельно-голубой ночной акцент в тёмной теме.
            - **Карточки и скругления:** списки серверов, каналов и пользователей оформлены в виде современных Material-карточек с мягкими контурами и закруглениями.
            - **Кнопка добавления серверов:** современный Extended Floating Action Button (FAB).
            - **Высокая контрастность:** четкая читаемость кнопок «ЛС», «Войти», «TX» (PTT) в любой системной теме.

            #### 🎛️ Ультракомпактная карточка управления звуком:
            - Двухстрочный блок управления громкостью динамика и чувствительностью микрофона/VOX высотой всего 56 dp.
            - Круглые тональные кнопки-контейнеры для динамика и микрофона, исключающие эффект невидимости иконок.

            #### 📑 Верхняя навигация по вкладкам:
            - Вся навигация (Каналы, Сообщения, Медиа, Файлы, Личные) расположена на привычном месте сверху экрана через `TabLayout`.
            - Аккуратные векторные иконки над каждой вкладкой и динамический бейдж непрочитанных сообщений на вкладке «Личные».

            #### 📄 Лицензия:
            - В репозиторий добавлена официальная лицензия MIT.

            #### 📦 Версии:
            - **Версия приложения:** `5.29.0` (код сборки `445`).
            - **Версия нативной библиотеки:** `5.29.0`.
          draft: false
          prerelease: false
          files: |
            client/build/outputs/apk/release/*.apk
            client/build/outputs/apk/debug/*.apk
            tests/output/*.jar
            TeamTalkNext-*-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
