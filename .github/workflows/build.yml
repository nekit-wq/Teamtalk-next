name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            build/outputs/apk/debug/*.apk
            build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          git archive --format=zip --output=TeamTalkProPlus-5.25-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v5.25' }}
          name: "TeamTalk Pro Plus v5.25"
          body: |
            ### TeamTalk Pro Plus v5.25

            #### Список изменений:
            - **Максимальная устойчивость в фоне:**
              - Добавлены постоянные `WakeLock` и `WifiLock` сервиса, благодаря чему связь и аудио не засыпают при выключенном экране и открытии тяжелых приложений (TikTok, YouTube и др.).
              - Исправлен `stopWithTask=false` и добавлен тип `mediaPlayback` в foregroundServiceType.
              - В основные настройки («Общие») добавлена кнопка **«Работа в фоне без ограничений»** (отключение оптимизации батареи Android в 1 клик).
            - **Исправлена логика кнопки «Войти / Покинуть канал»:**
              - При просмотре любого другого канала или корневого списка кнопка теперь сразу предлагает **«Войти в канал»** без необходимости предварительно выходить из текущего.
              - Кнопка **«Покинуть канал»** отображается только тогда, когда вы находитесь непосредственно внутри просматриваемого канала.
            - **Полностью стабильный нативный звук** без перехода в телефонный режим.
            - **Кнопка «Mute TTS»** и **единое поле «Имя клиента»**.
            - **Обновление из приложения:** всегда находит последний актуальный релиз на GitHub.
          draft: false
          prerelease: false
          files: |
            build/outputs/apk/debug/*.apk
            TeamTalkProPlus-5.25-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
