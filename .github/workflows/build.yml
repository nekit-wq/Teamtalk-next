name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          build-root-directory: client
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x client/gradlew

      - name: Build APKs
        working-directory: client
        run: |
          ./gradlew assembleDebug assembleRelease --build-cache --stacktrace 2>&1 | tee ../gradle_err.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload Failure Log to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure-log
          name: "Build Failure Log"
          files: gradle_err.log
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Failure Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TeamTalkProPlus-APK
          path: |
            client/build/outputs/apk/release/*.apk
            client/build/outputs/apk/debug/*.apk
            client/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Archive Source Code
        run: |
          TAG_NAME="${{ github.ref_name }}"
          git archive --format=zip --output=TeamTalkNext-${TAG_NAME}-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "TeamTalk Next ${{ github.ref_name }}"
          body: |
            ### TeamTalk Next v5.29.1

            #### ♿ Доступность TalkBack и перемещение говорящих:
            - **Сохранение фокуса скринридера:** устранена проблема сбивания и сброса курсора TalkBack при перемещении говорящих пользователей благодаря стабильным идентификаторам элементов и автоматическому восстановлению фокуса доступности.
            - **Корректное перемещение:** говорящие пользователи (включая локального пользователя по PTT и VOX) теперь надежно поднимаются наверх списка, в том числе в корневом канале.

            #### 📶 Пинг серверов в списке без подключения:
            - Индикатор пинга на карточках серверов в списке с цветовой дифференциацией задержки и полной озвучкой для TalkBack.

            #### 📋 Копирование свойств пользователя:
            - Действие «Скопировать все свойства» в меню свойств пользователя.
            - Отдельные кнопки копирования рядом с каждым полем (с виброоткликом и подсказкой для скринридеров).

            #### 👁️ Показ паролей:
            - Кнопка «Показать/скрыть пароль» в свойствах сервера и в учетных записях пользователей.

            #### 🛠️ Раздел Debug и история ошибок:
            - Новый раздел «Debug» в настройках с просмотром, копированием и очисткой истории сбоев и ошибок.

            #### 📦 Версии:
            - **Версия приложения:** `5.29.1` (код сборки `446`).
            - **Версия нативной библиотеки:** `5.29.1`.
          draft: false
          prerelease: false
          files: |
            client/build/outputs/apk/release/*.apk
            client/build/outputs/apk/debug/*.apk
            tests/output/*.jar
            TeamTalkNext-*-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
